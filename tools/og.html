<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/hx/base.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #05060a; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(700px 500px at 88% 10%, rgba(124,92,255,.28), transparent 60%), radial-gradient(600px 420px at 10% 100%, rgba(39,242,192,.18), transparent 60%), #05060a; }
  .grid { position: absolute; left: -10%; right: -10%; bottom: -40px; height: 300px; transform: perspective(500px) rotateX(62deg); transform-origin: bottom;
    background-image: linear-gradient(rgba(39,242,192,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(39,242,192,.35) 1px, transparent 1px); background-size: 60px 60px;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%); mask-image: linear-gradient(to top, #000 10%, transparent 90%); }
  .copy { position: absolute; left: 64px; top: 70px; width: 560px; }
  .copy h1 { font: 600 82px/.92 var(--font-display); letter-spacing: -.025em; margin: 22px 0 22px; color: #eef0f6; }
  .copy p { font: 400 22px/1.4 var(--font-body); color: #9aa0b4; margin: 0; }
  .wm { position: absolute; left: 64px; bottom: 54px; display: flex; align-items: center; gap: 14px; }
  .wm b { font: 700 26px/1 var(--font-display); letter-spacing: .06em; color: #eef0f6; }
  .wm b sup { color: #27f2c0; font-size: 12px; }
  .wm span { font: 500 15px/1 var(--font-mono); color: #7a8195; }
  .devs { position: absolute; right: -40px; top: 92px; width: 560px; }
  .lap { border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.16); box-shadow: 0 40px 90px rgba(0,0,0,.7); background: #0b0d13; }
  .lap .bar { height: 24px; background: #12151e; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .lap .bar i { width: 8px; height: 8px; border-radius: 50%; background: #3a3f4d; } .lap .bar i:nth-child(1){background:#ff5f57} .lap .bar i:nth-child(2){background:#febc2e} .lap .bar i:nth-child(3){background:#28c840}
  .lap img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; }
  .ph { position: absolute; width: 150px; border-radius: 24px; padding: 5px; background: linear-gradient(145deg, #2a2f3c, #0c0e14 40%, #1b1f2a); box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 30px 70px rgba(0,0,0,.8); }
  .ph img { display: block; width: 100%; aspect-ratio: 390/844; object-fit: cover; object-position: top; border-radius: 19px; }
  .ph.a { left: -70px; top: 170px; } .ph.b { right: 70px; top: 250px; }
  .live { position: absolute; left: 0; top: -40px; display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--font-mono); color: #27f2c0; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #27f2c0; box-shadow: 0 0 12px #27f2c0; }
</style></head>
<body>
<div class="og">
  <div class="grid"></div>
  <div class="copy">
    <p class="kicker" style="font-size:15px">design menu · vol. 02</p>
    <h1>Pick the design.<br><span class="grad">Watch it live.</span></h1>
    <p>Live websites and AI agent interfaces from Hanflux AI. Shortlist one, get a fixed quote in 24 hours.</p>
  </div>
  <div class="devs">
    <span class="live"><i></i>LIVE_COUNT live designs</span>
    <div class="lap"><div class="bar"><i></i><i></i><i></i></div><img src="/posters/LAP-d.webp"></div>
    <div class="ph a"><img src="/posters/PHA-m.webp"></div>
    <div class="ph b"><img src="/posters/PHB-m.webp"></div>
  </div>
  <div class="wm"><b>HANFLUX<sup>●</sup></b><span>hanflux-design-menu.vercel.app</span></div>
</div>
</body></html>
