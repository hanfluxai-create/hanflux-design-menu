<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/hx/base.css">
<link rel="stylesheet" href="/assets/hx/frames.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .og::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--spectrum); z-index: 5; }
  .top { position: absolute; left: 64px; right: 64px; top: 52px; display: flex; align-items: center; justify-content: space-between; }
  .top .wm { display: flex; align-items: center; gap: 14px; }
  .top .wm img.l { width: 46px; height: 46px; } .top .wm img.t { height: 21px; width: auto; }
  .top .kicker { font-size: 13px; }
  .copy { position: absolute; left: 64px; top: 168px; width: 560px; }
  .copy h1 { font: 600 60px/1.02 var(--font-display); letter-spacing: -.04em; margin: 20px 0 22px; color: var(--ink); }
  .copy p.l { font: 400 22px/1.45 var(--font-body); color: var(--ink-dim); margin: 0; max-width: 21em; }
  .foot { position: absolute; left: 64px; bottom: 50px; font: 400 14px/1 var(--font-mono); color: var(--ink-faint); letter-spacing: .04em; display: flex; align-items: center; gap: 14px; }
  .foot::before { content: ""; width: 26px; height: 3px; border-radius: 3px; background: var(--spectrum); }
  .mark { position: absolute; right: -120px; top: -40px; width: 760px; height: 560px; display: grid; place-items: center; opacity: .9; }
  .mark .lotus { width: 150px; opacity: 0; }
  .devs { position: absolute; right: 56px; top: 176px; width: 500px; }
  .devs .dev-d .vp img, .devs .dev-m .vp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .devs .dev-m { width: 150px; right: -18px; bottom: -80px; border-radius: 26px; padding: 5px; }
  .devs .dev-m .vp { border-radius: 21px; }
  .devs .d-bar { height: 28px; } .devs .d-dots i { width: 9px; height: 9px; }
  .live { position: absolute; left: 400px; bottom: 50px; display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); height: 14px; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--s-orange); }
</style></head>
<body>
<div class="og">
  <div class="mark"><canvas class="bloom on" data-bloom data-anchor=".lotus" data-still="1" data-seed="29"></canvas><div class="lotus-wrap" style="position:static"><img class="lotus" src="/assets/hx/brand/lotus.webp" width="510" height="364" alt=""></div></div>
  <div class="top"><span class="wm"><img class="l" src="/assets/hx/brand/lotus.webp" alt=""><img class="t" src="/assets/hx/brand/wordmark.svg" alt=""></span><p class="kicker dotk">design menu</p></div>
  <div class="copy">
    <p class="kicker low" style="font-size:14px">hanflux ai · the website factory</p>
    <h1>Your business website,<br>live in 48 hours.</h1>
    <p class="l">Pick a real design you can watch on your phone. From ₹40,000 in India, $600 worldwide. Launch prices till 31 Dec.</p>
  </div>
  <div class="devs">
    <div class="dev-d"><div class="d-bar"><span class="d-dots"><i></i><i></i><i></i></span><span class="d-url">hanflux-design-menu.vercel.app</span></div><div class="vp"><img src="/posters/LAP-d.webp" alt=""></div></div>
    <div class="dev-m"><div class="vp"><img src="/posters/PHA-m.webp" alt=""></div><span class="isl"></span></div>
  </div>
  <div class="foot">hanflux-design-menu.vercel.app</div>
  <span class="live"><i></i>live designs · fixed price</span>
</div>
<script src="/assets/hx/bloom.js"></script>
</body></html>
