<script>
/* First-open intro (always light): the lotus is traced in neon, flickers on and fills with the real mark while the
   name decodes; then the mark flies into the hero logo and the page shows through. Once per session, skippable. */
(function () {
  var d = document, H = d.documentElement, ov = d.getElementById('hxi');
  if (!ov || H.classList.contains('no-intro')) { ov && ov.remove(); return; }
  var done = false, t0 = 0;
  function end() { if (done) return; done = true; H.classList.remove('intro-on'); ov.remove(); }
  try { sessionStorage.setItem('hx-intro', '1'); } catch (e) {}
  H.classList.add('intro-on');
  setTimeout(end, 5000);
  ov.querySelector('.hxi-skip').addEventListener('click', end);
  ['pointerdown', 'wheel', 'keydown', 'touchmove'].forEach(function (e) { addEventListener(e, function () { if (t0 && performance.now() - t0 > 300) end(); }, { once: true, passive: true }); });
  var mark = ov.querySelector('.hxi-mark'), img = ov.querySelector('.hxi-img'), neon = ov.querySelector('.hxi-neon'), brand = ov.querySelector('.hxi-brand');
  var dec = ov.querySelector('.hxi-dec'), word = ov.querySelector('.hxi-word img'), tag = ov.querySelector('.hxi-tag');
  var W = innerWidth, Ht = innerHeight, bw = Math.min(W * .64, 400), bh = bw * 364 / 510, bx = (W - bw) / 2, by = Ht * .40 - bh / 2;
  mark.style.cssText = 'left:' + bx + 'px;top:' + by + 'px;width:' + bw + 'px;height:' + bh + 'px';
  brand.style.top = (by + bh + Math.min(40, bw * .1)) + 'px';
  var N = [].slice.call(ov.querySelectorAll('.n')).map(function (p) {
    var L = 60; try { L = p.getTotalLength(); } catch (e) {}
    var cs = getComputedStyle(p);
    p.style.stroke = cs.getPropertyValue('--c').trim();
    p.style.strokeDasharray = L + ' ' + L; p.style.strokeDashoffset = L;
    return { p: p, L: L, dl: parseFloat(cs.getPropertyValue('--d')) || 0 };
  });
  var G = '!<>-_/[]{}=+*^?#ABCDEFGHJKLMNPQRSTUVWXYZ0123456789', COLS = ['#1587bd', '#4b57d6', '#8a3fb0', '#d24f8c', '#f0782f'];
  function decode(el, t, start, per) {
    var s = el.getAttribute('data-t'), out = '';
    for (var i = 0; i < s.length; i++) {
      var at = start + i * per;
      if (s[i] === ' ') { out += ' '; continue; }
      if (t < at - 280) out += '<i style="opacity:0">' + s[i] + '</i>';
      else if (t < at) out += '<i style="color:' + COLS[(i + ((t / 70) | 0)) % COLS.length] + '">' + G[(Math.random() * G.length) | 0] + '</i>';
      else out += '<i>' + s[i] + '</i>';
    }
    el.innerHTML = out;
  }
  function cl(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function eo(x) { return 1 - Math.pow(1 - x, 3); }
  function eio(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  var hero = null, DRAW = 900, FLY0 = 2050, FLY = 640, OUT0 = 2520, OUT = 420;
  function frame(now) {
    if (done) return;
    if (!t0) t0 = now;
    var t = now - t0;
    // 1. neon trace
    for (var k = 0; k < N.length; k++) { var q = eo(cl((t - 120 - N[k].dl * 1000) / DRAW)); N[k].p.style.strokeDashoffset = N[k].L * (1 - q); }
    // 2. flicker on, then a soft hum
    var fl = 1;
    if (t > 1150 && t < 1420) fl = [1, .25, 1, .4, .9, .15, 1][(((t - 1150) / 45) | 0) % 7];
    else if (t >= 1420) fl = .94 + Math.sin(t / 37) * .06;
    // 3. the real mark fills the outline
    var fill = eo(cl((t - 1400) / 460));
    neon.style.opacity = fl * (1 - fill * .6);
    img.style.opacity = fill;
    img.style.transform = 'scale(' + (.96 + .04 * fill) + ')';
    // 4. the name decodes and resolves into the wordmark; the tagline decodes after it
    if (t > 600 && t < 1750) decode(dec, t, 900, 72);
    var ws = eo(cl((t - 1640) / 280)); dec.style.opacity = cl(1 - ws * 2.2); dec.style.filter = 'blur(' + (ws * 6) + 'px)'; word.style.opacity = ws; word.style.transform = 'translate(-50%,-50%) scale(' + (.92 + .08 * ws) + ')'; word.style.filter = 'blur(' + ((1 - ws) * 6) + 'px)';
    if (t > 1100 && t < 2250) decode(tag, t, 1350, 40);
    var bo = eo(cl((t - FLY0) / 260)); brand.style.opacity = 1 - bo; brand.style.transform = 'translateY(' + (-bo * 16) + 'px)';
    // 5. fly into the hero logo
    if (t >= FLY0 - 30 && !hero) { var h = d.querySelector('.ln-mark'), r = h && h.getBoundingClientRect(); hero = r && r.width > 4 ? r : { left: (W - 110) / 2, top: 140, width: 110, height: 78 }; }
    if (hero) {
      var f = eio(cl((t - FLY0) / FLY)), s = hero.width / bw;
      mark.style.transform = 'translate(' + ((hero.left - bx) * f) + 'px,' + ((hero.top - by) * f) + 'px) scale(' + (1 + (s - 1) * f) + ')';
      neon.style.opacity = fl * .4 * (1 - f);
    }
    // 6. the page shows through
    var o = cl((t - OUT0) / OUT); ov.style.opacity = 1 - eo(o);
    if (t > OUT0 + OUT) { end(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
